[project]
name = "mech-console-tools"
version = "0.1.0"
description = "Host-side UART tools for the mech_console ESP32 firmware"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5,<4",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-embedded-idf>=2.9.3",
    "pytest-embedded-serial-esp>=2.9.3",
]
