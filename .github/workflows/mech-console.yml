name: mech_console regression

on:
  push:
    branches: [main]
    paths:
      - 'ESP32/mech_console/**'
      - '.github/workflows/mech-console.yml'
  pull_request:
    paths:
      - 'ESP32/mech_console/**'
      - '.github/workflows/mech-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mech-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ESP32/mech_console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ESP32/mech_console/.cache/doxygen/
          key: doxygen-${{ runner.os }}-1.18.0
      - name: Build public API documentation
        run: python tools/build_docs.py
      - name: Upload browsable documentation
        uses: actions/upload-artifact@v4
        with:
          name: mech-console-api-docs
          path: ESP32/mech_console/build-docs/site/
          if-no-files-found: error
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ESP32/mech_console/build-docs/site/

  qemu:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ESP32/mech_console
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install QEMU and Python test tools
        run: |
          . "$IDF_PATH/export.sh"
          apt-get update
          apt-get install -y --no-install-recommends libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python "$IDF_PATH/tools/idf_tools.py" install qemu-riscv32
          python -m pip install uv
          uv sync --locked --group test --group dev --python 3.12
      - name: Check source formatting
        run: |
          . "$IDF_PATH/export.sh"
          uv run --group dev python tools/format_sources.py --check
      - name: Build and run all project QEMU test apps
        run: |
          . "$IDF_PATH/export.sh"
          python tools/run_qemu_tests.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-console-qemu-results
          path: ESP32/mech_console/test-results/
          if-no-files-found: warn

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docs, qemu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy API documentation
        id: deployment
        uses: actions/deploy-pages@v4
