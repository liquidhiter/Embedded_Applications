name: mech_console regression

on:
  push:
    branches: [main]
    paths:
      - 'ESP32/mech_console/**'
      - '.github/workflows/mech-console.yml'
  pull_request:
    paths:
      - 'ESP32/mech_console/**'
      - '.github/workflows/mech-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mech-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ESP32/mech_console
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and Python test tools
        run: |
          . "$IDF_PATH/export.sh"
          apt-get update
          apt-get install -y --no-install-recommends libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python "$IDF_PATH/tools/idf_tools.py" install qemu-riscv32
          python -m pip install uv
          uv sync --locked --group test --group dev --python 3.12
      - name: Check source formatting
        run: |
          . "$IDF_PATH/export.sh"
          uv run --group dev python tools/format_sources.py --check
      - name: Build and run all project QEMU test apps
        run: |
          . "$IDF_PATH/export.sh"
          python tools/run_qemu_tests.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-console-qemu-results
          path: ESP32/mech_console/test-results/
          if-no-files-found: warn
